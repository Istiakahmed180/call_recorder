plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Read signing config: from environment variables (CI), else from
// keystore.properties (local). If neither is present, release stays unsigned.
def ksStoreFile = System.getenv("RELEASE_STORE_FILE")
def ksStorePassword = System.getenv("RELEASE_STORE_PASSWORD")
def ksKeyAlias = System.getenv("RELEASE_KEY_ALIAS")
def ksKeyPassword = System.getenv("RELEASE_KEY_PASSWORD")

def keystorePropsFile = rootProject.file("keystore.properties")
if (keystorePropsFile.exists()) {
    def props = new Properties()
    keystorePropsFile.withInputStream { props.load(it) }
    ksStoreFile = ksStoreFile ?: props.getProperty("storeFile")
    ksStorePassword = ksStorePassword ?: props.getProperty("storePassword")
    ksKeyAlias = ksKeyAlias ?: props.getProperty("keyAlias")
    ksKeyPassword = ksKeyPassword ?: props.getProperty("keyPassword")
}

def hasSigning = ksStoreFile && ksStorePassword && ksKeyAlias && ksKeyPassword

android {
    namespace 'com.example.callrecorder'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.callrecorder"
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName "1.5"
    }

    signingConfigs {
        if (hasSigning) {
            release {
                storeFile rootProject.file(ksStoreFile)
                storePassword ksStorePassword
                keyAlias ksKeyAlias
                keyPassword ksKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
